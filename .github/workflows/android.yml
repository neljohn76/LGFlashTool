name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Report the failure log as an issue so the failure cause is visible
      # without Actions log access.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI build failed"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "### Matching lines"
            echo '```'
            grep -E "^e: |error:|FAILURE|Could not|What went wrong|Caused by|Exception|\.kt:|Execution failed" build.log | tail -n 60 || true
            echo '```'
            echo ""
            echo "### Last 60 lines of build.log"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } > failure.md
          gh issue create --title "CI build failed (${GITHUB_SHA:0:7})" --body-file failure.md || true

      - name: Upload APKs (Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LGFlashTool-apks
          path: app/build/outputs/apk/**/*.apk

      # Publish the APKs as a GitHub Release too, so they can be downloaded
      # directly from the repo's Releases page without opening the run.
      - name: Publish APKs to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            --title "LG Flash Tool — latest build" \
            --notes "Automated build from the latest main commit. See the README for usage and warnings. Flash at your own risk." \
            --prerelease
